{% extends 'base.html' %}

{% block title %}Access Denied — LifeFlow{% endblock %}

{% block content %}
<div style="text-align: center; max-width: 480px; margin: 4rem auto;">
  <div style="font-size: 4rem; font-weight: 800; color: var(--critical);">403</div>
  <h2 style="font-size: 1.5rem; margin-bottom: 0.75rem;">Access Forbidden</h2>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Your account role does not have authorization to view this resource.</p>
  <a href="{{ url_for('auth.dashboard') }}" class="btn btn-primary">Return to Your Portal</a>
</div>
{% endblock %}
